<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>iRent 車況拍照引導 · Demo</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!--
      App shell：header / #screen / footer 三段。
      畫面內容一律由 src/screens/*.js 的 mount(root, ctx) 渲染進 #screen，
      不要在這裡加畫面專屬的 markup（見 src/CONTRACT.md）。
    -->
    <div class="app">
      <header class="header">
        <p class="eyebrow" id="app-eyebrow">PigeonPacket · 和泰 iRent 黑客松</p>
        <h1 id="app-title">載入中…</h1>
        <p class="subtitle" id="app-subtitle"></p>
      </header>

      <main id="screen" class="screen"></main>

      <footer class="app-footer">
        <p class="footnote" id="app-footnote">
          此為 PIG-5 可點擊原型：不接後端，全部使用模擬資料。
        </p>
      </footer>
    </div>

    <!-- 簡報跳頁列（?nav=1 才顯示，由 src/router.js 渲染） -->
    <nav id="demo-nav" class="demo-nav" hidden></nav>

    <script type="module" src="app.js"></script>
  </body>
</html>
